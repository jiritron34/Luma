name: Android APK
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android build packages
        run: yes | sdkmanager --licenses && sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build and test debug APK
        shell: bash
        run: |
          set +e
          gradle --no-daemon testDebugUnitTest assembleDebug --stacktrace > build-output.log 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then
            errors=$(grep -E '^(e:|w:|.*error:|.*What went wrong:|.*Execution failed for task|.*FAILED)' build-output.log | tail -n 25)
            if [ -z "$errors" ]; then errors=$(tail -n 35 build-output.log); fi
            printf '%s\n' "$errors" | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
            exit "$result"
          fi
          cat build-output.log
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: luma-finance-debug
          path: app/build/outputs/apk/debug/app-debug.apk
